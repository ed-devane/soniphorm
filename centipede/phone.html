<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/png" href="/centipede/favicon.png" />
    <title>Centipede Tag Camera</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
      #app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #status { padding: 8px 12px; font-size: 14px; color: #bbb; min-height: 36px; }
      #view { flex: 1; position: relative; min-height: 0; }
      #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px 12px; align-items: center; }
      #controls select, #controls button { font-size: 15px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 8px 10px; }
      #controls select { flex: 1; min-width: 0; }
      #select { flex: 1 1 100%; font-size: 22px !important; padding: 18px !important; background: #ddd !important; color: #111 !important; font-weight: 600; }
      #select:active { background: #fff !important; }
      #select.unlinked { background: #555 !important; color: #999 !important; }
      #start { margin: auto; font-size: 20px; padding: 18px 28px; background: #ddd; color: #111; border: none; border-radius: 8px; }
      #intro { margin: auto; max-width: 420px; padding: 24px; text-align: center; line-height: 1.5; color: #bbb; }
      .hidden { display: none !important; }
      /* Landscape: picture on the left, controls in a column on the right with
         Select filling what's left of it, so the camera keeps its full width. */
      @media (orientation: landscape) {
        #app { display: grid; grid-template-columns: 1fr minmax(170px, 30%); grid-template-rows: auto 1fr; }
        #status { grid-column: 1 / -1; padding: 4px 12px; min-height: 0; }
        #view, #start, #intro { grid-column: 1; grid-row: 2; }
        #controls { grid-column: 2; grid-row: 2; flex-direction: column; flex-wrap: nowrap; align-items: stretch; padding: 4px 12px 8px 8px; min-height: 0; }
        #controls select { flex: none; }
        #select { flex: 1 1 auto; min-height: 80px; }
      }
    </style>
    <script type="module" crossorigin src="/centipede/assets/phone-Cq_vug2E.js"></script>
    <link rel="modulepreload" crossorigin href="/centipede/assets/relay-D3pXfr7s.js">
  </head>
  <body>
    <div id="app">
      <div id="status">Centipede Tag Camera</div>
      <div id="intro" class="hidden"></div>
      <button id="start" class="hidden">Start camera</button>
      <div id="view" class="hidden"><canvas id="canvas"></canvas></div>
      <div id="controls" class="hidden">
        <select id="camera"><option value="">Back camera</option></select>
        <select id="detail">
          <option value="fast">Fast</option>
          <option value="normal" selected>Normal</option>
          <option value="fine">Fine</option>
        </select>
        <button id="torch" class="hidden">Light</button>
        <button id="fullscreen" class="hidden">Full screen</button>
        <button id="select">Select</button>
      </div>
    </div>
  </body>
</html>
